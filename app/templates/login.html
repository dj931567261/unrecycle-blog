{% extends "base.html" %}

{% block title %}管理员登录 | DevHub-Me{% endblock %}

{% block content %}

    <div class="login-container">
        <div class="glass-card" style="padding: 40px; border-color: rgba(255,255,255,0.09);">
            
            <div class="login-header">
                <div style="font-size: 32px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2>系统管理登录</h2>
                <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">登录以管理博客、导航链接和收藏书签</p>
            </div>
            
            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">管理员账号</label>
                    <input type="text" id="username" required class="form-control" placeholder="输入管理员用户名" autocomplete="username">
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password">安全密码</label>
                    <input type="password" id="password" required class="form-control" placeholder="输入管理员密码" autocomplete="current-password">
                </div>
                
                <div id="login-error" class="error-banner" style="margin-bottom: 16px; margin-top: 0;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px 20px; font-size: 15px;">
                    <i class="fa-solid fa-right-to-bracket"></i> 验证并登录
                </button>
            </form>
            
        </div>
    </div>

{% endblock %}

{% block scripts %}
<script>
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.style.display = 'none';
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Success! Token is saved in HttpOnly cookie automatically by backend,
                // and the API returned success. Redirect to admin dashboard.
                window.location.href = '/admin';
            } else {
                loginError.textContent = `❌ 登录失败: ${data.detail || '用户名或密码不正确'}`;
                loginError.style.display = 'block';
            }
        } catch (err) {
            loginError.textContent = '❌ 网络请求失败，请稍后重试。';
            loginError.style.display = 'block';
        }
    });
</script>
{% endblock %}
