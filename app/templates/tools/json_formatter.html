{% extends "base.html" %}

{% block title %}JSON 格式化与校验 | Unrecycle-Me{% endblock %}

{% block content %}

    <div style="margin-top: 10px; margin-bottom: 20px;">
        <a href="/tools" style="font-size: 14px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-arrow-left"></i> 返回工具箱
        </a>
        <h1 style="font-size: 26px; font-weight: 800; margin-top: 12px;">📁 JSON 格式化与校验</h1>
        <p style="color: var(--text-secondary); font-size: 14px;">在本地粘贴并对 JSON 字符串进行校验、缩进美化或单行压缩，确保您的关键敏感数据不离开浏览器。</p>
    </div>

    <!-- Main Workspace -->
    <div class="tool-page-layout">
        
        <!-- Controls Toolbar -->
        <div class="tool-header-row">
            <div class="toolbar-controls">
                <label style="font-size: 13px; color: var(--text-secondary);">缩进格式：</label>
                <select id="indent-select" class="tool-select">
                    <option value="2">2 个空格</option>
                    <option value="4" selected>4 个空格</option>
                    <option value="tab">Tab 缩进</option>
                </select>
                <button id="format-btn" class="btn btn-primary" style="padding: 8px 16px;">
                    <i class="fa-solid fa-code"></i> 美化格式
                </button>
                <button id="minify-btn" class="btn btn-secondary" style="padding: 8px 16px;">
                    <i class="fa-solid fa-compress"></i> 压缩一行
                </button>
            </div>
            <div class="toolbar-controls">
                <button id="clear-btn" class="btn btn-secondary" style="padding: 8px 16px;">
                    <i class="fa-solid fa-trash-can"></i> 清空
                </button>
                <button id="copy-btn" class="btn btn-secondary" style="padding: 8px 16px;">
                    <i class="fa-solid fa-copy"></i> 复制结果
                </button>
            </div>
        </div>

        <!-- Input / Output workspace split -->
        <div class="tool-workspace">
            
            <!-- Left panel: Raw Input -->
            <div class="panel-container">
                <div class="panel-title-bar">
                    <span>RAW JSON 输入</span>
                    <span id="char-count">0 字符</span>
                </div>
                <textarea id="raw-json-input" class="tool-textarea" placeholder='在此处粘贴或输入 JSON 字符串，例如：{"name": "unrecycle", "version": 1.0, "active": true, "tags": ["python", "fastapi"]}' autocomplete="off" spellcheck="false"></textarea>
            </div>
            
            <!-- Right panel: Highlighted Output -->
            <div class="panel-container" id="right-output-panel">
                <style>
                    /* Collapsible Tree Styles */
                    .json-details {
                        display: block;
                        margin: 2px 0;
                    }
                    .json-details[open] > .json-summary > .json-toggle {
                        transform: rotate(0deg);
                    }
                    .json-details:not([open]) > .json-summary > .json-toggle {
                        transform: rotate(-90deg);
                    }
                    .json-summary {
                        cursor: pointer;
                        list-style: none;
                        outline: none;
                        user-select: none;
                        display: inline-flex;
                        align-items: center;
                        gap: 6px;
                        padding: 2px 4px;
                        border-radius: 4px;
                        transition: background 0.2s;
                    }
                    .json-summary::-webkit-details-marker {
                        display: none;
                    }
                    .json-summary:hover {
                        background: rgba(255, 255, 255, 0.05);
                    }
                    .json-toggle {
                        display: inline-block;
                        font-size: 10px;
                        color: var(--text-muted);
                        transition: transform 0.2s ease;
                        width: 12px;
                        text-align: center;
                    }
                    .json-size {
                        color: var(--text-muted);
                        font-size: 11px;
                        font-style: italic;
                        margin-left: 6px;
                    }
                    .json-tree-content {
                        border-left: 1px dashed rgba(255, 255, 255, 0.1);
                        margin-left: 10px;
                        padding-left: 14px;
                    }
                    .json-tree-row {
                        line-height: 1.6;
                        margin-top: 2px;
                        font-family: var(--font-mono);
                        font-size: 13px;
                    }
                    .view-tab-btn {
                        padding: 4px 10px;
                        font-size: 12px;
                        border-radius: 6px;
                        border: 1px solid var(--border-color);
                        background: transparent;
                        color: var(--text-secondary);
                        cursor: pointer;
                        transition: var(--transition-smooth);
                    }
                    .view-tab-btn.active {
                        background: rgba(255, 255, 255, 0.08);
                        color: var(--text-primary);
                        border-color: rgba(255, 255, 255, 0.2);
                    }
                </style>
                <div class="panel-title-bar" style="padding: 6px 16px;">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="tab-text-btn" class="view-tab-btn active">文本视图</button>
                        <button id="tab-tree-btn" class="view-tab-btn">树形视图 (可收起)</button>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="expand-all-btn" class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px; display: none;">展开全部</button>
                        <button id="collapse-all-btn" class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px; display: none;">收起全部</button>
                        <span id="format-status" style="color: var(--text-muted);">空</span>
                    </div>
                </div>
                
                <!-- Text Area output -->
                <div id="formatted-json-output" class="formatted-output-container">
                    <span style="color: var(--text-muted); font-style: italic;">格式化后的 JSON 将在此处输出...</span>
                </div>
                
                <!-- Tree representation output -->
                <div id="tree-json-output" class="formatted-output-container" style="display: none; background: rgba(10, 11, 14, 0.95);">
                    <span style="color: var(--text-muted); font-style: italic;">树形视图将在此处输出...</span>
                </div>
            </div>
            
        </div>
        
        <!-- Validation Error Message Banner -->
        <div id="validation-error" class="error-banner"></div>
    </div>

{% endblock %}

{% block scripts %}
<script>
    const rawInput = document.getElementById('raw-json-input');
    const formattedOutput = document.getElementById('formatted-json-output');
    const treeOutput = document.getElementById('tree-json-output');
    const errorBanner = document.getElementById('validation-error');
    const indentSelect = document.getElementById('indent-select');
    const formatBtn = document.getElementById('format-btn');
    const minifyBtn = document.getElementById('minify-btn');
    const clearBtn = document.getElementById('clear-btn');
    const copyBtn = document.getElementById('copy-btn');
    const charCount = document.getElementById('char-count');
    const formatStatus = document.getElementById('format-status');

    // Tabs
    const tabTextBtn = document.getElementById('tab-text-btn');
    const tabTreeBtn = document.getElementById('tab-tree-btn');
    const expandAllBtn = document.getElementById('expand-all-btn');
    const collapseAllBtn = document.getElementById('collapse-all-btn');

    let formattedResult = '';
    let parsedJsonObj = null;
    let activeTab = 'text'; // 'text' or 'tree'

    // Count chars helper
    rawInput.addEventListener('input', () => {
        const text = rawInput.value;
        charCount.textContent = `${text.length} 字符`;
    });

    // Custom syntax highlighting function for text JSON
    function syntaxHighlight(jsonStr) {
        jsonStr = jsonStr.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return jsonStr.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g, function (match) {
            let cls = 'json-number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) {
                    cls = 'json-key';
                } else {
                    cls = 'json-string';
                }
            } else if (/true|false/.test(match)) {
                cls = 'json-boolean';
            } else if (/null/.test(match)) {
                cls = 'json-null';
            }
            return `<span class="${cls}">${match}</span>`;
        });
    }

    // Helper to escape HTML characters
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Recursive function to generate collapsible HTML tree
    function renderJsonTree(val, isLast = true) {
        const type = typeof val;

        if (val === null) {
            return `<span class="json-null">null</span>${isLast ? '' : ','}`;
        }

        if (type === 'boolean') {
            return `<span class="json-boolean">${val}</span>${isLast ? '' : ','}`;
        }

        if (type === 'number') {
            return `<span class="json-number">${val}</span>${isLast ? '' : ','}`;
        }

        if (type === 'string') {
            return `<span class="json-string">"${escapeHtml(val)}"</span>${isLast ? '' : ','}`;
        }

        if (Array.isArray(val)) {
            if (val.length === 0) {
                return `<span class="json-bracket">[]</span>${isLast ? '' : ','}`;
            }

            let html = `<details open class="json-details">`;
            html += `<summary class="json-summary"><span class="json-toggle">▼</span><span class="json-bracket">[</span><span class="json-size">// Array(${val.length})</span></summary>`;
            html += `<div class="json-tree-content">`;
            for (let i = 0; i < val.length; i++) {
                const isItemLast = (i === val.length - 1);
                html += `<div class="json-tree-row">${renderJsonTree(val[i], isItemLast)}</div>`;
            }
            html += `</div>`;
            html += `<span class="json-bracket">]</span>${isLast ? '' : ','}</details>`;
            return html;
        }

        if (type === 'object') {
            const keys = Object.keys(val);
            if (keys.length === 0) {
                return `<span class="json-bracket">{}</span>${isLast ? '' : ','}`;
            }

            let html = `<details open class="json-details">`;
            html += `<summary class="json-summary"><span class="json-toggle">▼</span><span class="json-bracket">{</span><span class="json-size">// Object(${keys.length})</span></summary>`;
            html += `<div class="json-tree-content">`;
            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                const isItemLast = (i === keys.length - 1);
                html += `<div class="json-tree-row"><span class="json-key">"${escapeHtml(key)}"</span>: ${renderJsonTree(val[key], isItemLast)}</div>`;
            }
            html += `</div>`;
            html += `<span class="json-bracket">}</span>${isLast ? '' : ','}</details>`;
            return html;
        }
    }

    // Main Format action
    function doFormat() {
        const rawValue = rawInput.value.trim();
        if (!rawValue) {
            formattedOutput.innerHTML = '<span style="color: var(--text-muted); font-style: italic;">格式化后的 JSON 将在此处输出...</span>';
            treeOutput.innerHTML = '<span style="color: var(--text-muted); font-style: italic;">树形视图将在此处输出...</span>';
            errorBanner.style.display = 'none';
            formatStatus.textContent = '空';
            formatStatus.style.color = 'var(--text-muted)';
            parsedJsonObj = null;
            return;
        }

        try {
            // Parse JSON
            parsedJsonObj = JSON.parse(rawValue);
            
            // Indent choice
            const indentVal = indentSelect.value;
            const spacer = indentVal === 'tab' ? '\t' : parseInt(indentVal);
            
            // Stringify
            formattedResult = JSON.stringify(parsedJsonObj, null, spacer);
            
            // Render text view with highlight
            formattedOutput.innerHTML = syntaxHighlight(formattedResult);

            // Render tree view
            treeOutput.innerHTML = renderJsonTree(parsedJsonObj, true);
            
            // Clean up error states
            errorBanner.style.display = 'none';
            formatStatus.textContent = '验证通过 (VALID)';
            formatStatus.style.color = 'var(--success)';
        } catch (err) {
            formattedResult = '';
            parsedJsonObj = null;
            formattedOutput.innerHTML = `<span style="color: var(--error); font-style: italic;">解析失败，详情见下方错误面板...</span>`;
            treeOutput.innerHTML = `<span style="color: var(--error); font-style: italic;">解析失败，无法渲染树形视图...</span>`;
            
            errorBanner.textContent = `❌ JSON 格式错误: ${err.message}`;
            errorBanner.style.display = 'block';
            formatStatus.textContent = '格式错误 (INVALID)';
            formatStatus.style.color = 'var(--error)';
        }
    }

    // Minify Action
    function doMinify() {
        const rawValue = rawInput.value.trim();
        if (!rawValue) return;

        try {
            parsedJsonObj = JSON.parse(rawValue);
            formattedResult = JSON.stringify(parsedJsonObj);
            formattedOutput.innerHTML = syntaxHighlight(formattedResult);
            
            // Render tree view too
            treeOutput.innerHTML = renderJsonTree(parsedJsonObj, true);
            
            errorBanner.style.display = 'none';
            formatStatus.textContent = '已压缩 (MINIFIED)';
            formatStatus.style.color = 'var(--success)';
        } catch (err) {
            formattedResult = '';
            parsedJsonObj = null;
            formattedOutput.innerHTML = `<span style="color: var(--error); font-style: italic;">解析失败，详情见下方错误面板...</span>`;
            errorBanner.textContent = `❌ JSON 格式错误: ${err.message}`;
            errorBanner.style.display = 'block';
            formatStatus.textContent = '格式错误 (INVALID)';
            formatStatus.style.color = 'var(--error)';
        }
    }

    // Tabs switching click triggers
    tabTextBtn.addEventListener('click', () => {
        activeTab = 'text';
        tabTextBtn.classList.add('active');
        tabTreeBtn.classList.remove('active');
        
        formattedOutput.style.display = 'block';
        treeOutput.style.display = 'none';
        
        expandAllBtn.style.display = 'none';
        collapseAllBtn.style.display = 'none';
    });

    tabTreeBtn.addEventListener('click', () => {
        activeTab = 'tree';
        tabTreeBtn.classList.add('active');
        tabTextBtn.classList.remove('active');
        
        formattedOutput.style.display = 'none';
        treeOutput.style.display = 'block';
        
        expandAllBtn.style.display = 'inline-block';
        collapseAllBtn.style.display = 'inline-block';
    });

    // Expand / Collapse tree helpers
    expandAllBtn.addEventListener('click', () => {
        const details = treeOutput.querySelectorAll('.json-details');
        details.forEach(d => d.open = true);
    });

    collapseAllBtn.addEventListener('click', () => {
        const details = treeOutput.querySelectorAll('.json-details');
        details.forEach(d => {
            // Keep root node open if wanted, or just close everything
            d.open = false;
        });
        // Optionally keep the main root open
        const root = treeOutput.querySelector('.json-details');
        if (root) root.open = true;
    });

    // Click Bindings
    formatBtn.addEventListener('click', doFormat);
    minifyBtn.addEventListener('click', doMinify);
    
    clearBtn.addEventListener('click', () => {
        rawInput.value = '';
        charCount.textContent = '0 字符';
        doFormat();
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', () => {
        if (!formattedResult) return;
        
        navigator.clipboard.writeText(formattedResult).then(() => {
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> 已复制!';
            copyBtn.style.borderColor = 'var(--success)';
            copyBtn.style.color = 'var(--success)';
            
            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.style.borderColor = '';
                copyBtn.style.color = '';
            }, 1500);
        }).catch(err => {
            alert('复制失败，请手动选择复制：' + err);
        });
    });

    // Auto format on start
    window.addEventListener('load', () => {
        if (rawInput.value) {
            doFormat();
        }
    });
</script>
{% endblock %}
