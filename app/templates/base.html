<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Unrecycle-Me | 个人数字空间{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block description %}这是我个人的技术博客、常用网址导航与网站收藏夹，用于记录我的技术成长与灵感碎片。{% endblock %}">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/css/style.css?v=1.13">
    
    <!-- Prism.js Syntax Highlighting Theme (Tomorrow Night / Dark) -->
    <link rel="stylesheet" href="/static/css/prism-tomorrow.min.css">
    <link rel="stylesheet" href="/static/css/prism-line-numbers.min.css">
    
    <!-- Font Awesome Icons (Local) -->
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    
    <!-- Theme initialization script (runs immediately to prevent flashing) -->
    <script>
        (function() {
            let savedTheme = 'dark';
            try {
                savedTheme = localStorage.getItem('theme') || 'dark';
            } catch (error) {
                savedTheme = 'dark';
            }
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (
                'IntersectionObserver' in window &&
                !window.matchMedia('(prefers-reduced-motion: reduce)').matches
            ) {
                document.documentElement.classList.add('motion-ready');
                window.__motionReadyFailsafe = window.setTimeout(() => {
                    document.documentElement.classList.remove('motion-ready');
                }, 2000);
            }
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="container nav-container">
            <!-- Site Brand Logo -->
            <a href="/" class="site-logo" aria-label="Unrecycle.me 首页">
                <span class="site-logo-mark" aria-hidden="true">U/</span>
                <span class="site-logo-word">Unrecycle<span>.me</span></span>
            </a>
            
            <!-- Main Site Nav links -->
            <nav id="site-nav" class="site-nav" aria-label="主导航">
                <ul>
                    <li><a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}" {% if request.url.path == '/' %}aria-current="page"{% endif %}>首页</a></li>
                    <li><a href="/blog" class="nav-link {% if request.url.path.startswith('/blog') %}active{% endif %}" {% if request.url.path.startswith('/blog') %}aria-current="page"{% endif %}>博客</a></li>
                    <li><a href="/bookmarks" class="nav-link {% if request.url.path.startswith('/bookmarks') %}active{% endif %}" {% if request.url.path.startswith('/bookmarks') %}aria-current="page"{% endif %}>收藏</a></li>
                    <li><a href="/tools" class="nav-link {% if request.url.path.startswith('/tools') %}active{% endif %}" {% if request.url.path.startswith('/tools') %}aria-current="page"{% endif %}>工具箱</a></li>
                </ul>
            </nav>
            
            <!-- Header actions (Search & Admin status) -->
            <div class="nav-actions">
                <button id="mobile-nav-toggle" class="btn-icon mobile-nav-toggle" type="button"
                        aria-label="打开导航菜单" aria-controls="site-nav" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <button id="theme-toggle-btn" class="btn-icon" type="button" title="切换主题 (明亮 / 暗黑)" aria-label="切换明亮或暗黑主题">
                    <i class="fa-solid fa-sun" id="theme-icon-sun" style="display:none;"></i>
                    <i class="fa-solid fa-moon" id="theme-icon-moon" style="display:none;"></i>
                </button>
                <button id="search-trigger-btn" class="btn-icon nav-search-trigger" type="button"
                        data-search-trigger aria-haspopup="dialog" aria-label="打开全局搜索"
                        title="搜索 (Cmd + K / Ctrl + K)">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <span class="nav-search-label">搜索</span>
                    <kbd>⌘K</kbd>
                </button>
                
                {% if is_admin or username %}
                    <a href="/admin" class="btn btn-secondary" style="padding: 8px 16px;">
                        <i class="fa-solid fa-sliders"></i> 后台
                    </a>
                    <button type="button" onclick="logoutAdmin()" class="btn btn-danger nav-auth-action" style="padding: 8px 16px;">
                        <i class="fa-solid fa-right-from-bracket"></i> 退出
                    </button>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container site-footer-inner">
            <div>
                <strong>Unrecycle.me</strong>
                <p>记录技术、工具与持续生长的灵感。</p>
            </div>
            <p class="site-footer-meta">&copy; 2026 · FastAPI / SQLite / Vanilla Web</p>
        </div>
    </footer>

    <!-- Global search dialog (Cmd + K) -->
    <div id="search-modal" class="modal-backdrop search-modal" role="dialog" aria-modal="true"
         aria-labelledby="search-dialog-title" aria-hidden="true" inert>
        <div class="search-dialog">
            <div class="modal-header search-dialog-header">
                <div>
                    <span class="search-dialog-kicker">COMMAND PALETTE</span>
                    <h2 id="search-dialog-title">搜索这个数字空间</h2>
                </div>
                <button id="search-modal-close" class="modal-close" type="button" aria-label="关闭搜索弹窗">&times;</button>
            </div>
            <div class="search-dialog-input-wrap">
                <input type="search" id="global-search-input" class="form-control"
                       maxlength="100" autocomplete="off"
                       placeholder="搜索博客、导航或收藏..." aria-label="输入搜索关键词">
                <i class="fa-solid fa-keyboard" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px;"></i>
                <i class="fa-solid fa-search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            </div>
            <div id="search-results-container" class="search-results-container" aria-live="polite">
                <div class="search-status">输入任意内容开始检索...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/prism-core.min.js"></script>
    <script src="/static/js/prism-autoloader.min.js"></script>
    <script src="/static/js/prism-line-numbers.min.js"></script>
    <script>
        // Configure Prism autoloader to load language components from BootCDN instead of cdnjs
        if (window.Prism && Prism.plugins && Prism.plugins.autoloader) {
            Prism.plugins.autoloader.languages_path = 'https://cdn.bootcdn.net/ajax/libs/prism/1.29.0/components/';
        }
    </script>
    
    <!-- Main JS logic for search modal, auth callbacks -->
    <script>
        // Log out admin helper
        async function logoutAdmin() {
            try {
                const response = await fetch('/api/auth/logout', { method: 'POST' });
                if (response.ok) {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error("Logout failed:", error);
            }
        }

        // Global search triggers
        const searchModal = document.getElementById('search-modal');
        const searchTriggerBtn = document.getElementById('search-trigger-btn');
        const searchModalClose = document.getElementById('search-modal-close');
        const globalSearchInput = document.getElementById('global-search-input');
        const searchResultsContainer = document.getElementById('search-results-container');
        const mobileNavToggle = document.getElementById('mobile-nav-toggle');
        const siteNav = document.getElementById('site-nav');
        let searchTimer = null;
        let searchController = null;
        let searchReturnFocus = null;
        let searchFocusTimer = null;

        function setSearchStatus(message) {
            const status = document.createElement('div');
            status.className = 'search-status';
            status.textContent = message;
            searchResultsContainer.replaceChildren(status);
        }

        function getSafeResultUrl(rawUrl) {
            const url = String(rawUrl || '').trim();
            if (!url) return null;
            try {
                const parsed = new URL(url, window.location.origin);
                if (!['http:', 'https:'].includes(parsed.protocol)) return null;
                return parsed.origin === window.location.origin
                    ? `${parsed.pathname}${parsed.search}${parsed.hash}`
                    : parsed.href;
            } catch (error) {
                return null;
            }
        }

        function renderSearchResults(items) {
            const fragment = document.createDocumentFragment();
            const iconMap = {
                '博客': 'fa-book-open',
                '文章': 'fa-book-open',
                '导航': 'fa-link',
                '收藏': 'fa-bookmark',
                'post': 'fa-book-open',
                'nav': 'fa-link',
                'bookmark': 'fa-bookmark'
            };
            const typeLabelMap = {
                'post': '博客',
                'nav': '导航',
                'bookmark': '收藏'
            };

            items.forEach(item => {
                const safeUrl = getSafeResultUrl(item.url || item.href);
                if (!safeUrl) return;

                const link = document.createElement('a');
                link.href = safeUrl;
                link.className = 'search-result-card';

                const iconWrapper = document.createElement('span');
                iconWrapper.className = 'search-result-icon';
                const icon = document.createElement('i');
                const rawType = String(item.type || item.kind || '内容');
                const type = typeLabelMap[rawType] || rawType;
                icon.className = `fa-solid ${iconMap[rawType] || iconMap[type] || 'fa-file-lines'}`;
                iconWrapper.appendChild(icon);

                const body = document.createElement('span');
                body.className = 'search-result-body';
                const typeLabel = document.createElement('span');
                typeLabel.className = 'search-result-type';
                typeLabel.textContent = type;
                const title = document.createElement('span');
                title.className = 'search-result-title';
                title.textContent = String(item.title || '未命名内容');
                const description = document.createElement('span');
                description.className = 'search-result-description';
                description.textContent = String(item.description || item.desc || item.summary || '');
                body.append(typeLabel, title, description);

                const arrow = document.createElement('i');
                arrow.className = 'fa-solid fa-chevron-right search-result-arrow';
                link.append(iconWrapper, body, arrow);
                if (/^https?:\/\//i.test(safeUrl)) {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                }
                fragment.appendChild(link);
            });

            if (!fragment.childNodes.length) {
                setSearchStatus('未找到匹配内容');
                return;
            }
            searchResultsContainer.replaceChildren(fragment);
        }

        function openSearch() {
            window.clearTimeout(searchFocusTimer);
            searchReturnFocus = document.activeElement instanceof HTMLElement
                ? document.activeElement
                : searchTriggerBtn;
            searchModal.removeAttribute('inert');
            searchModal.setAttribute('aria-hidden', 'false');
            searchModal.classList.add('open');
            document.body.classList.add('modal-open');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            searchFocusTimer = window.setTimeout(() => {
                if (searchModal.classList.contains('open') && !searchModal.hasAttribute('inert')) {
                    globalSearchInput.focus();
                }
            }, reduceMotion ? 0 : 120);
        }

        function closeSearch() {
            window.clearTimeout(searchFocusTimer);
            searchModal.classList.remove('open');
            document.body.classList.remove('modal-open');
            globalSearchInput.value = '';
            if (searchController) searchController.abort();
            window.clearTimeout(searchTimer);
            setSearchStatus('输入任意内容开始检索...');
            if (searchReturnFocus && document.contains(searchReturnFocus)) {
                searchReturnFocus.focus();
            } else if (searchModal.contains(document.activeElement)) {
                document.activeElement.blur();
            }
            searchModal.setAttribute('aria-hidden', 'true');
            searchModal.setAttribute('inert', '');
        }

        document.querySelectorAll('[data-search-trigger]').forEach(trigger => {
            trigger.addEventListener('click', openSearch);
        });
        if (searchModalClose) searchModalClose.addEventListener('click', closeSearch);

        // Close on clicking backdrop
        searchModal.addEventListener('click', (e) => {
            if (e.target === searchModal) closeSearch();
        });

        function closeMobileNav() {
            if (!siteNav || !mobileNavToggle) return;
            siteNav.classList.remove('open');
            mobileNavToggle.setAttribute('aria-expanded', 'false');
            mobileNavToggle.setAttribute('aria-label', '打开导航菜单');
            const icon = mobileNavToggle.querySelector('i');
            if (icon) icon.className = 'fa-solid fa-bars';
        }

        if (mobileNavToggle && siteNav) {
            mobileNavToggle.addEventListener('click', () => {
                const willOpen = !siteNav.classList.contains('open');
                closeMobileNav();
                if (willOpen) {
                    siteNav.classList.add('open');
                    mobileNavToggle.setAttribute('aria-expanded', 'true');
                    mobileNavToggle.setAttribute('aria-label', '关闭导航菜单');
                    const icon = mobileNavToggle.querySelector('i');
                    if (icon) icon.className = 'fa-solid fa-xmark';
                }
            });
            siteNav.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMobileNav));
            document.addEventListener('click', event => {
                if (!siteNav.contains(event.target) && !mobileNavToggle.contains(event.target)) {
                    closeMobileNav();
                }
            });
        }

        // Hotkeys for search (Cmd + K / Ctrl + K)
        window.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                if (searchModal.classList.contains('open')) {
                    closeSearch();
                } else {
                    openSearch();
                }
            }
            if (e.key === 'Escape' && searchModal.classList.contains('open')) {
                closeSearch();
            }
            if (e.key === 'Escape') closeMobileNav();
            if (e.key === 'Tab' && searchModal.classList.contains('open')) {
                const focusable = Array.from(searchModal.querySelectorAll(
                    'button:not([disabled]), input:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
                )).filter(element => !element.hasAttribute('inert'));
                if (!focusable.length) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

        // Search the complete server-side index so the dialog behaves consistently on every page.
        globalSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            window.clearTimeout(searchTimer);
            if (searchController) searchController.abort();
            if (!query) {
                setSearchStatus('输入任意内容开始检索...');
                return;
            }
            setSearchStatus('检索中...');
            searchTimer = window.setTimeout(async () => {
                searchController = new AbortController();
                try {
                    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                        headers: { 'Accept': 'application/json' },
                        signal: searchController.signal
                    });
                    if (!response.ok) throw new Error(`Search request failed: ${response.status}`);
                    const data = await response.json();
                    const results = Array.isArray(data) ? data : (data.results || data.items || []);
                    renderSearchResults(Array.isArray(results) ? results : []);
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setSearchStatus('搜索服务暂不可用，请稍后重试');
                    }
                }
            }, 220);
        });

        // Theme switching handler with DOMContentLoaded safety
        window.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            if (!themeToggleBtn || !sunIcon || !moonIcon) return;

            function updateThemeUI(theme) {
                if (theme === 'light') {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'block';
                } else {
                    sunIcon.style.display = 'block';
                    moonIcon.style.display = 'none';
                }
            }

            // Init theme icons
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            updateThemeUI(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                const applyTheme = () => {
                    document.documentElement.setAttribute('data-theme', newTheme);
                    try {
                        localStorage.setItem('theme', newTheme);
                    } catch (error) {
                        console.warn('无法保存主题偏好:', error);
                    }
                    updateThemeUI(newTheme);
                };
                if (
                    document.startViewTransition &&
                    !window.matchMedia('(prefers-reduced-motion: reduce)').matches
                ) {
                    document.startViewTransition(applyTheme);
                } else {
                    applyTheme();
                }
            });
        });

        // Reveal content only when motion is allowed. Content stays visible without JS.
        const revealElements = document.querySelectorAll('[data-reveal]');
        if (document.documentElement.classList.contains('motion-ready') && revealElements.length) {
            const revealObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -32px' });
            revealElements.forEach(element => revealObserver.observe(element));
            window.clearTimeout(window.__motionReadyFailsafe);
        } else {
            revealElements.forEach(element => element.classList.add('is-visible'));
            window.clearTimeout(window.__motionReadyFailsafe);
        }

        // Header gains a compact solid state after the page starts scrolling.
        let headerScrollTicking = false;
        const siteHeader = document.querySelector('.site-header');
        function updateHeaderState() {
            if (siteHeader) siteHeader.classList.toggle('is-scrolled', window.scrollY > 12);
            headerScrollTicking = false;
        }
        window.addEventListener('scroll', () => {
            if (headerScrollTicking) return;
            headerScrollTicking = true;
            window.requestAnimationFrame(updateHeaderState);
        }, { passive: true });
        updateHeaderState();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
