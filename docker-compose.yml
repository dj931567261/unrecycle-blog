services:
  web:
    image: ghcr.io/${GHCR_OWNER:?请在 .env 中设置 GHCR_OWNER}/unrecycle-me:${IMAGE_TAG:-latest}
    container_name: unrecycle-me
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/blog.db
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置高强度 SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置高强度 ADMIN_PASSWORD}
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
      SEED_INITIAL_DATA: ${SEED_INITIAL_DATA:-false}
      RUN_LEGACY_COMPAT_MIGRATION: ${RUN_LEGACY_COMPAT_MIGRATION:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${UPLOADS_DIR:-./uploads}:/app/app/static/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read(1)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
