name: Unrecycle-Me CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unrecycle-me-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  LOCAL_IMAGE: unrecycle-me:ci

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          secret_key="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -base64 32)"
          echo "::add-mask::${secret_key}"
          echo "::add-mask::${admin_password}"
          echo "SECRET_KEY=${secret_key}" >> "${GITHUB_ENV}"
          echo "ADMIN_PASSWORD=${admin_password}" >> "${GITHUB_ENV}"

      - name: Run Ruff critical checks
        run: ruff check . --select E9,F63,F7,F82

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          ADMIN_USERNAME: ci-admin
          APP_ENV: test
          COOKIE_SECURE: "false"
        run: pytest -q --timeout=60

  container-smoke:
    name: Test the release container image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for health
        shell: bash
        run: |
          set -Eeuo pipefail
          secret_key="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -base64 32)"
          data_dir="$(mktemp -d)"
          uploads_dir="$(mktemp -d)"
          headers_file=""
          body_file=""
          cleanup() {
            if docker container inspect unrecycle-me-smoke >/dev/null 2>&1; then
              docker logs unrecycle-me-smoke || true
              docker rm --force unrecycle-me-smoke || true
            fi
            [[ -z "${headers_file}" ]] || rm -f "${headers_file}"
            [[ -z "${body_file}" ]] || rm -f "${body_file}"
            sudo rm -rf "${data_dir}" "${uploads_dir}"
          }
          trap cleanup EXIT
          sudo chown -R 10001:10001 "${data_dir}" "${uploads_dir}"
          docker run --detach \
            --name unrecycle-me-smoke \
            --publish 127.0.0.1:8000:8000 \
            --volume "${data_dir}:/app/data" \
            --volume "${uploads_dir}:/app/app/static/uploads" \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --pids-limit 256 \
            --env DATABASE_URL=sqlite:////app/data/blog.db \
            --env SECRET_KEY="${secret_key}" \
            --env ADMIN_USERNAME=ci-admin \
            --env ADMIN_PASSWORD="${admin_password}" \
            --env APP_ENV=production \
            --env COOKIE_SECURE=true \
            "${LOCAL_IMAGE}"

          for attempt in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' unrecycle-me-smoke)"
            if [[ "${health}" == "healthy" ]]; then
              curl --fail --silent --show-error http://127.0.0.1:8000/healthz >/dev/null
              curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
              curl --fail --silent --show-error http://127.0.0.1:8000/login >/dev/null
              docker exec unrecycle-me-smoke test -w /app/data
              docker exec unrecycle-me-smoke test -w /app/app/static/uploads
              docker exec unrecycle-me-smoke sh -c \
                'probe=/app/app/static/uploads/.write-probe; : > "${probe}"; rm -f "${probe}"'

              headers_file="$(mktemp)"
              body_file="$(mktemp)"
              login_payload="$(jq -nc \
                --arg username ci-admin \
                --arg password "${admin_password}" \
                '{username: $username, password: $password}')"
              login_status="$(curl --silent --show-error \
                --output "${body_file}" \
                --dump-header "${headers_file}" \
                --write-out '%{http_code}' \
                --header 'Content-Type: application/json' \
                --data "${login_payload}" \
                http://127.0.0.1:8000/api/auth/login)"
              test "${login_status}" = "200"
              set_cookie="$(grep -im1 '^set-cookie:' "${headers_file}" | tr -d '\r')"
              cookie_lower="${set_cookie,,}"
              [[ "${cookie_lower}" == 'set-cookie: __host-admin_session='* ]]
              [[ "${cookie_lower}" == *'; httponly'* ]]
              [[ "${cookie_lower}" == *'; secure'* ]]
              [[ "${cookie_lower}" == *'; samesite=strict'* ]]
              [[ "${cookie_lower}" == *'; path=/'* ]]
              exit 0
            fi
            if [[ "${health}" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 2
          done

          echo "Container did not become healthy in time" >&2
          exit 1

      - name: Export the tested image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          docker save "${LOCAL_IMAGE}" | gzip -1 > unrecycle-me-image.tar.gz

      - name: Upload the tested image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: unrecycle-me-tested-image
          path: unrecycle-me-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the tested image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the tested image artifact
        uses: actions/download-artifact@v4
        with:
          name: unrecycle-me-tested-image

      - name: Load the tested image
        shell: bash
        run: |
          set -Eeuo pipefail
          gzip -dc unrecycle-me-image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"

      - name: Publish the tested image without rebuilding
        shell: bash
        run: |
          set -Eeuo pipefail
          latest_image="ghcr.io/${OWNER_LOWER}/unrecycle-me:latest"
          commit_image="ghcr.io/${OWNER_LOWER}/unrecycle-me:${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}" "${latest_image}"
          docker tag "${LOCAL_IMAGE}" "${commit_image}"
          docker push "${commit_image}"
          docker push "${latest_image}"
